[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grs-sdr-sim"
version = "0.1.0"
description = "SDR virtual da estação terrestre SpaceLab — substituto do grs-iq-rx para testes"
readme = "README.md"
requires-python = ">=3.11"

# Duas dependências, e nenhuma delas é scipy: a conformação gaussiana e o
# ruído são numpy puro. Um simulador que arrasta meio ambiente científico para
# dentro da imagem de teste acaba não sendo usado.
dependencies = [
    "numpy>=1.26",
    "pyzmq>=25,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

# O painel é um .html servido de dentro do pacote; sem isto o setuptools só
# empacota .py e a página some na instalação não-editável.
[tool.setuptools.package-data]
sdr_sim = ["panel.html"]
